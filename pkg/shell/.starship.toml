# Catppuccin Mocha palette.
palette = "catppuccin_mocha"

format = """
$time\
${custom.status0}\
$status\
$cmd_duration\
$line_break\
$username\
$hostname\
$localip\
$shlvl\
$singularity\
$kubernetes\
$directory\
$vcsh\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$docker_context\
$package\
$c\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$swift\
$terraform\
$vlang\
$vagrant\
$zig\
$buf\
$nix_shell\
$conda\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$env_var\
$crystal\
$custom\
$sudo\
$line_break\
$jobs\
$battery\
$os\
$container\
$shell\
$character"""

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# Keep Starship's built-in color names Catppuccin-aware for modules that use
# their default styles.
black = "#11111b"
white = "#cdd6f4"
purple = "#cba6f7"
cyan = "#94e2d5"
bright-black = "#6c7086"
bright-red = "#f38ba8"
bright-green = "#a6e3a1"
bright-yellow = "#f9e2af"
bright-blue = "#89b4fa"
bright-purple = "#cba6f7"
bright-cyan = "#94e2d5"
bright-white = "#f5e0dc"

[time]
disabled = false
use_12hr = true
format = '[$time]($style)'
time_format = '%c'
style = 'subtext0'

[username]
style_user = 'bold lavender'
style_root = 'bold red'

[hostname]
style = 'bold lavender'

[directory]
style = 'bold blue'

[git_branch]
style = 'bold mauve'

[git_status]
style = 'bold red'

[git_state]
style = 'bold peach'

[status]
disabled = false
success_symbol = ''
map_symbol = true
pipestatus = true
style = 'red'
format = '[ exit( $status $symbol)( $common_meaning)]($style)'

[custom.status0]
disabled = false
when = '''test "$STARSHIP_CMD_STATUS" = "0";'''
symbol = "0 🟢"
format = '[ exit $symbol](bold green)'

[cmd_duration]
format = ' took [$duration]($style)'
style = 'yellow'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'
vimcmd_visual_symbol = '[❮](bold yellow)'
vimcmd_replace_symbol = '[❮](bold mauve)'
vimcmd_replace_one_symbol = '[❮](bold mauve)'

[shlvl]
threshold = 2
disabled = false
